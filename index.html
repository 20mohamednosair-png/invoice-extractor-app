<script>

function createCostCenter(storeCode){

    storeCode = String(storeCode).trim();

    if(storeCode.length < 4){
        storeCode = storeCode.padStart(4,"0");
    }

    return "AE" + storeCode + "610";
}

function formatDate(dateValue){

    if(!dateValue) return "";

    let date = new Date(dateValue);

    if(isNaN(date)){
        return dateValue;
    }

    let month =
    String(date.getMonth()+1).padStart(2,"0");

    let day =
    String(date.getDate()).padStart(2,"0");

    let year =
    date.getFullYear();

    return `${month}/${day}/${year}`;
}
