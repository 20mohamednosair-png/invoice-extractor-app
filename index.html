<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SAP Telecom Upload Generator</title>

<!-- FIX 1: Properly formatted script tag with protocol -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 30px;
}

input, button {
    margin: 10px;
    padding: 10px;
}

button {
    background: #0078d4;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #005ea6;
}
</style>
</head>

<body>

<h2>SAP Telecom Upload Generator</h2>

<p>Etisalat Excel:</p>
<input type="file" id="etisalatFile">

<p>Store Master:</p>
<input type="file" id="storeFile">

<p>Posting Date:</p>
<input type="date" id="postingDate">

<br>

<button onclick="generateSAP()">
Generate SAP Upload
</button>

<script>

function excelDateToJS(dateValue) {
    if (typeof dateValue === "number") {
        const date = XLSX.SSF.parse_date_code(dateValue);
        return new Date(date.y, date.m - 1, date.d);
    }
    return new Date(dateValue);
}

function formatDateSAP(date) {
    if (isNaN(date.getTime())) return "";
    let d = String(date.getDate()).padStart(2, "0");
    let m = String(date.getMonth() + 1).padStart(2, "0");
    let y = date.getFullYear();
    return `${m}/${d}/${y}`;
}

function createCostCenter(storeCode) {
    storeCode = String(storeCode);
    if (storeCode.length < 4) {
        storeCode = storeCode.padStart(4, "0");
    }
    return "AE" + storeCode + "610";
}

async function generateSAP() {
    try {
        const etisalatFile = document.getElementById("etisalatFile").files[0];
        const storeFile = document.getElementById("storeFile").files[0];
        const postingDate = document.getElementById("postingDate").value;

        if (!etisalatFile || !storeFile) {
            alert("Please upload both files");
            return;
        }

        if (!postingDate) {
            alert("Please select a posting date");
            return;
        }

        const etBuffer = await etisalatFile.arrayBuffer();
        const stBuffer = await storeFile.arrayBuffer();

        const etWB = XLSX.read(etBuffer, { type: "array" });
        const stWB = XLSX.read(stBuffer, { type: "array" });

        // FIX 2: Sheet index fallback (uses Sheet 2 if available, otherwise Sheet 1)
        const etSheetName = etWB.SheetNames[1] || etWB.SheetNames[0];
        const stSheetName = stWB.SheetNames[0];

        const etData = XLSX.utils.sheet_to_json(etWB.Sheets[etSheetName]);
        const storeData = XLSX.utils.sheet_to_json(stWB.Sheets[stSheetName]);

        let storeMap = {};

        storeData.forEach(r => {
            if (r.Store) {
                let storeName = String(r.Store)
                    .replace(/^\d+\s+/, "")
                    .trim()
                    .toUpperCase();
                storeMap[storeName] = r["Store Code"];
            }
        });

        let output = [];

        etData.forEach(row => {
            let storeName = String(row.Store || "").trim().toUpperCase();
            let billNo = row["Bill Number"];
            let grossAmount = Number(row["Current Month Charges"] || 0);

            if (!billNo || grossAmount === 0) return;

            let netAmount = Number((grossAmount / 1.05).toFixed(2));
            let storeCode = storeMap[storeName];
            let costCenter = storeCode ? createCostCenter(storeCode) : "";

            let billDate = excelDateToJS(row["Bill Date"]);
            let posting = new Date(postingDate);

            let monthText = billDate.toLocaleDateString('en-US', {
                month: 'short',
                year: '2-digit'
            }).replace(" ", "-");

            let itemText = `Telecom Voice ${monthText} Inv`;

            output.push({
                "Invoice ID": "",
                "Company Code": "AE03",
                "Transaction": 1,
                "Invoicing Party": "2000004275",
                "Reference": billNo,
                "Document Date": formatDateSAP(billDate),
                "Posting Date": formatDateSAP(posting),
                "Document Type": "KR",
                "Document Header Text": itemText,
                "Currency": "AED",
                "Gross Invoice Amount": grossAmount.toFixed(2),
                "Business Place": "DXB",
                "Payment Method": "W",
                "Invoice Receipt Date": formatDateSAP(posting),
                "Account": "6117151004",
                "Item Text": itemText,
                "Debit Credit": "S",
                "Amount in Document Currency": netAmount.toFixed(2),
                "Tax Code": "IT",
                "Cost Center": costCenter,
                "Profit Center": "100005"
            });
        });

        if (output.length === 0) {
            alert("No matching rows found. Please check your column names in the Excel file.");
            return;
        }

        const ws = XLSX.utils.json_to_sheet(output);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "SAP Upload");
        XLSX.writeFile(wb, "SAP_Upload.xlsx");

        alert(`Done! Generated ${output.length} rows`);

    } catch (error) {
        console.error(error);
        alert("An error occurred: " + error.message);
    }
}

</script>

</body>
</html>
